services:
  database:
    image: postgres:16-alpine
    container_name: nomaanos-sentinel-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-nomaanos_sentinel}
      POSTGRES_USER: ${DATABASE_USER:-sentinel_dev}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-sentinel_local_dev_secret_2026}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5433}:5432"
    volumes:
      - sentinel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-sentinel_dev} -d ${DATABASE_NAME:-nomaanos_sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  sentinel_postgres_data:
    name: nomaanos_sentinel_postgres_data

