[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-agent"
version = "0.1.0"
description = "NomaanOS Sentinel Linux monitoring agent for Ubuntu Server 24.04 LTS"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "NomaanOS Sentinel Security Team" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
sentinel-agent = "sentinel_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

